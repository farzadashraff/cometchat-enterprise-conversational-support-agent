name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src tests

      - name: Unit tests
        # No ANTHROPIC_API_KEY or LLM network calls are ever needed (every
        # LLM-path test uses FakeLLMClient). Most retrieval/evidence tests
        # do use the real local embedding model (BAAI/bge-small-en-v1.5 via
        # fastembed) rather than a fake one, since retrieval quality can't
        # be meaningfully tested with a hash-based embedding — this means
        # the runner needs network access once to download the model
        # weights (cached thereafter for the rest of the job).
        run: pytest -v
