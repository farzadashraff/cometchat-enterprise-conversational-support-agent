name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src tests

      - name: Build retrieval index (ingest)
        # `.data/` (the derived index + embedding cache) is intentionally
        # gitignored — it's a rebuildable artifact of `knowledge-base/`,
        # not source. A handful of tests (e.g. test_evaluation_runner.py,
        # and test_cli_chat.py's build_agent success-path test) exercise
        # the real, *default* on-disk index directly, the same way a
        # developer would after following the README's own documented
        # `ingest` step — they intentionally don't build their own
        # throwaway index the way the retrieval/evidence fixtures in
        # tests/conftest.py do. On a fresh checkout that index doesn't
        # exist yet, so this step builds it once before the tests run.
        # No ANTHROPIC_API_KEY or Anthropic network call is involved —
        # ingestion only needs the local embedding model (downloaded once
        # here; see the Unit tests step below).
        run: python -m aster_row_agent.cli ingest

      - name: Unit tests
        # No ANTHROPIC_API_KEY or LLM network calls are ever needed (every
        # LLM-path test uses FakeLLMClient). Most retrieval/evidence tests
        # do use the real local embedding model (BAAI/bge-small-en-v1.5 via
        # fastembed) rather than a fake one, since retrieval quality can't
        # be meaningfully tested with a hash-based embedding — this means
        # the runner needs network access once to download the model
        # weights (cached thereafter for the rest of the job).
        run: pytest -v
